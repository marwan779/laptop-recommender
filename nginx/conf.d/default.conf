# ==============================================================================
# Rate Limiting Zones
# ==============================================================================
# 10MB memory zone holds ~160,000 IP addresses. Rate: 20 requests/second per IP.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ==============================================================================
# Upstream Definitions
# ==============================================================================
upstream catalog_backend {
    server catalog-service:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream frontend_app {
    server frontend:3000 max_fails=3 fail_timeout=10s;
    keepalive 16;
}

# ==============================================================================
# HTTP Server (Reverse Proxy & API Gateway)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Maximum upload payload size (for review artifacts and scraping ingest)
    client_max_body_size 25M;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # CORS Origin Mapping
    # --------------------------------------------------------------------------
    set $cors_origin "";
    if ($http_origin ~* "^https?://(localhost(:[0-9]+)?|127\.0\.0\.1(:[0-9]+)?|.*\.ngrok(-free)?\.app)$") {
        set $cors_origin $http_origin;
    }

    # --------------------------------------------------------------------------
    # Health Check (Direct, un-throttled for Docker & load balancers)
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://catalog_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Swagger & OpenAPI Documentation
    # --------------------------------------------------------------------------
    location ~* ^/(docs|redoc|openapi\.json) {
        proxy_pass http://catalog_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Core API Gateway Routes (/api/v1/...)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        # Handle CORS Preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, Cache-Control' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            return 204;
        }

        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        proxy_pass http://catalog_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Chroma vector search and scraping operations
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # Frontend Application (Next.js / React SPA)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If frontend service container is down during backend-only dev:
        proxy_intercept_errors on;
        error_page 502 = @frontend_offline;
    }

    location @frontend_offline {
        default_type application/json;
        return 502 '{"status":"FRONTEND_OFFLINE","message":"Frontend container is not running. Access API directly at /api/v1/ or API docs at /docs"}';
    }
}
