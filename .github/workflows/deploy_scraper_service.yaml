name: Deploy Scraper Service

on:
  workflow_run:
    workflows: ["Scraper Service CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to deploy or rollback to (e.g. 1.3.0 or scraper-service-v1.3.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-scraper-service
  cancel-in-progress: false

env:
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

jobs:
  promote:
    name: Promote Image
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        contains(github.event.workflow_run.head_commit.message, 'scraper-service') &&
        (
          contains(github.event.workflow_run.head_commit.message, 'release-please--') ||
          startsWith(github.event.workflow_run.head_commit.message, 'chore(main): release') ||
          startsWith(github.event.workflow_run.head_commit.message, 'chore: release')
        )
      )
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Extract Clean Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.target_version }}"
          else
            RAW_VER=$(jq -r '."services/scraper-service"' .release-please-manifest.json)
          fi
          CLEAN_VER=$(echo "$RAW_VER" | sed -E 's/.*v//')
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${CLEAN_VER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote Image (No Rebuild)
        run: |
          RELEASE_TAG="${{ steps.vars.outputs.version }}"
          TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Rollback/Manual deploy requested for existing tag: ${{ env.IMAGE }}:${RELEASE_TAG}"
            docker manifest inspect "${{ env.IMAGE }}:${RELEASE_TAG}" > /dev/null
          else
            echo "Promoting image: ${{ env.IMAGE }}:${TARGET_SHA} -> ${{ env.IMAGE }}:${RELEASE_TAG} and ${{ env.IMAGE }}:latest"
            docker buildx imagetools create \
              --tag "${{ env.IMAGE }}:${RELEASE_TAG}" \
              --tag "${{ env.IMAGE }}:latest" \
              "${{ env.IMAGE }}:${TARGET_SHA}"
          fi

  deploy_prod:
    name: Deploy to Production (AWS Fargate / Batch)
    needs: [promote]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Deploy to AWS Batch (placeholder)
        run: |
          echo "Deploying ${{ env.IMAGE }}:${{ needs.promote.outputs.version }} to AWS Batch..."
          # aws batch register-job-definition ...
          echo "Successfully deployed version ${{ needs.promote.outputs.version }} to production!"

  tag_release:
    name: Create Tag & GitHub Release (Post-Deploy)
    needs: [deploy_prod]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
