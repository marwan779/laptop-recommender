name: Deploy Scraper Service

on:
  push:
    tags:
      - 'scraper-service-v*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to deploy or rollback to (e.g. 1.3.0 or scraper-service-v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-scraper-service
  cancel-in-progress: false

env:
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

jobs:
  meta:
    name: Resolve version & source image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.m.outputs.version }}
      source_sha: ${{ steps.m.outputs.source_sha }}
    steps:
      - name: Checkout tagged commit (full history to find the source commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: m
        env:
          TAG: ${{ github.ref_name }}
          SERVICE_DIRECTORY: services/scraper-service
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.target_version }}"
            CLEAN_VER=$(echo "$RAW_VER" | sed -E 's/.*v//')
            echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "Manual deploy/rollback requested for version: ${CLEAN_VER}"
          else
            echo "version=${TAG#scraper-service-v}" >> "$GITHUB_OUTPUT"

            # The tag points at the release commit (version files only).
            # The image to promote was built by CI from the LAST commit that changed the
            # service folder before the release commit. We cannot just use HEAD^ because
            # commits that touch other folders do not trigger this service's CI (no image).
            SRC=$(git log -1 --format=%H HEAD^ -- "$SERVICE_DIRECTORY")
            if [ -z "$SRC" ]; then
              echo "::error::Could not find a source commit for $SERVICE_DIRECTORY"
              exit 1
            fi
            echo "Source commit for image: $SRC"
            echo "source_sha=$SRC" >> "$GITHUB_OUTPUT"
          fi

  promote_and_deploy:
    name: Promote Image & Deploy
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote Container Image (No Rebuild)
        run: |
          RELEASE_TAG="${{ needs.meta.outputs.version }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Rollback/Manual deploy requested for existing tag: ${{ env.IMAGE }}:${RELEASE_TAG}"
            docker manifest inspect "${{ env.IMAGE }}:${RELEASE_TAG}" > /dev/null
          else
            SOURCE_SHA="${{ needs.meta.outputs.source_sha }}"
            echo "Promoting image: ${{ env.IMAGE }}:${SOURCE_SHA} -> ${{ env.IMAGE }}:${RELEASE_TAG} and ${{ env.IMAGE }}:latest"
            docker buildx imagetools create \
              --tag "${{ env.IMAGE }}:${RELEASE_TAG}" \
              --tag "${{ env.IMAGE }}:latest" \
              "${{ env.IMAGE }}:${SOURCE_SHA}"
          fi

      - name: Deploy to AWS Batch / Fargate
        run: |
          echo "Deploying ${{ env.IMAGE }}:${{ needs.meta.outputs.version }} to AWS Batch..."
          # aws batch register-job-definition ...
          echo "Successfully deployed version ${{ needs.meta.outputs.version }} to production!"

  publish_release:
    name: Promote Pre-release to Official Latest Release
    needs: [promote_and_deploy]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark Release as Production Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Promoting ${{ github.ref_name }} from Pre-release to Official Production Release..."
          gh release edit "${{ github.ref_name }}" --prerelease=false --latest
          echo "Release ${{ github.ref_name }} is now marked as the official latest release!"
