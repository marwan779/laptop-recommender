name: Deploy Scraper Service

on:
  push:
    branches:
      - main
    paths:
      - "services/scraper-service/CHANGELOG.md"
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to deploy or rollback to (e.g. 1.3.0 or scraper-service-v1.3.0)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: deploy-scraper-service
  cancel-in-progress: false

env:
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

jobs:
  promote:
    name: Promote & Package Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract Clean Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.target_version }}"
          else
            RAW_VER=$(jq -r '."services/scraper-service"' .release-please-manifest.json)
          fi
          CLEAN_VER=$(echo "$RAW_VER" | sed -E 's/.*v//')
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${CLEAN_VER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote or Build Release Image
        run: |
          RELEASE_TAG="${{ steps.vars.outputs.version }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Rollback/Manual deploy requested for existing tag: ${{ env.IMAGE }}:${RELEASE_TAG}"
            docker manifest inspect "${{ env.IMAGE }}:${RELEASE_TAG}" > /dev/null
          else
            # Check if SHA tag exists in Docker Hub to promote in seconds, otherwise build & push
            if docker manifest inspect "${{ env.IMAGE }}:${{ github.sha }}" > /dev/null 2>&1; then
              echo "Promoting existing image: ${{ env.IMAGE }}:${{ github.sha }} -> ${{ env.IMAGE }}:${RELEASE_TAG}"
              docker buildx imagetools create \
                --tag "${{ env.IMAGE }}:${RELEASE_TAG}" \
                --tag "${{ env.IMAGE }}:latest" \
                "${{ env.IMAGE }}:${{ github.sha }}"
            else
              echo "Building and pushing release image: ${{ env.IMAGE }}:${RELEASE_TAG}"
              docker build \
                -t "${{ env.IMAGE }}:${RELEASE_TAG}" \
                -t "${{ env.IMAGE }}:latest" \
                ./services/scraper-service
              docker push "${{ env.IMAGE }}:${RELEASE_TAG}"
              docker push "${{ env.IMAGE }}:latest"
            fi
          fi

  deploy_prod:
    name: Deploy to Production (AWS Fargate / Batch)
    needs: [promote]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to AWS Batch (placeholder)
        run: |
          echo "Deploying ${{ env.IMAGE }}:${{ needs.promote.outputs.version }} to AWS Batch..."
          # aws batch register-job-definition ...
          echo "Successfully deployed version ${{ needs.promote.outputs.version }} to production!"

  tag_release:
    name: Create Tag & GitHub Release (Post-Deploy)
    needs: [deploy_prod]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true
