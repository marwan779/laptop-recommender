name: Deploy Scraper Service

on:
  push:
    tags:
      - 'scraper-service-v*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to deploy or rollback to (e.g. 1.3.0 or scraper-service-v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-scraper-service
  cancel-in-progress: false

env:
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.target_version }}"
            CLEAN_VER=$(echo "$RAW_VER" | sed -E 's/.*v//')
            echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "tag=scraper-service-v${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "Deploying version: ${CLEAN_VER}"
          else
            TAG="${{ github.ref_name }}"
            echo "version=${TAG#scraper-service-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "Deploying version: ${TAG#scraper-service-v}"
          fi

  promote_and_deploy:
    name: Promote Image & Deploy
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote Container Image (No Rebuild)
        run: |
          RELEASE_TAG="${{ needs.meta.outputs.version }}"

          if docker manifest inspect "${{ env.IMAGE }}:${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "Image ${{ env.IMAGE }}:${RELEASE_TAG} already exists in registry."
          else
            echo "Promoting image: ${{ env.IMAGE }}:edge -> ${{ env.IMAGE }}:${RELEASE_TAG} and ${{ env.IMAGE }}:latest"
            docker buildx imagetools create \
              --tag "${{ env.IMAGE }}:${RELEASE_TAG}" \
              --tag "${{ env.IMAGE }}:latest" \
              "${{ env.IMAGE }}:edge"
          fi

      - name: Deploy to AWS Batch / Fargate
        run: |
          echo "Deploying ${{ env.IMAGE }}:${{ needs.meta.outputs.version }} to AWS Batch..."
          # aws batch register-job-definition ...
          echo "Successfully deployed version ${{ needs.meta.outputs.version }} to production!"

  publish_release:
    name: Promote Pre-release to Official Latest Release
    needs: [meta, promote_and_deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark Release as Production Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          echo "Promoting ${TAG} from Pre-release to Official Production Release..."
          gh release edit "${TAG}" --prerelease=false --latest
          echo "Release ${TAG} is now marked as the official latest release!"
