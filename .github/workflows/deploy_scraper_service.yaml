name: Deploy Scraper Service

on:
  push:
    tags:
      - 'scraper-service-v*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to deploy or rollback to (e.g. 1.3.0 or scraper-service-v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-scraper-service
  cancel-in-progress: false

env:
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

jobs:
  promote_and_deploy:
    name: Promote Image & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Extract Clean Version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.target_version }}"
          else
            RAW_VER="${{ github.ref_name }}"
          fi
          CLEAN_VER=$(echo "$RAW_VER" | sed -E 's/.*v//')
          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "Deploying version: ${CLEAN_VER}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote Container Image (No Rebuild)
        run: |
          RELEASE_TAG="${{ steps.vars.outputs.version }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Rollback/Manual deploy requested for existing tag: ${{ env.IMAGE }}:${RELEASE_TAG}"
            docker manifest inspect "${{ env.IMAGE }}:${RELEASE_TAG}" > /dev/null
          else
            echo "Promoting image: ${{ env.IMAGE }}:${{ github.sha }} -> ${{ env.IMAGE }}:${RELEASE_TAG} and ${{ env.IMAGE }}:latest"
            docker buildx imagetools create \
              --tag "${{ env.IMAGE }}:${RELEASE_TAG}" \
              --tag "${{ env.IMAGE }}:latest" \
              "${{ env.IMAGE }}:${{ github.sha }}"
          fi

      - name: Deploy to AWS Batch / Fargate
        run: |
          echo "Deploying ${{ env.IMAGE }}:${{ steps.vars.outputs.version }} to AWS Batch..."
          # aws batch register-job-definition ...
          echo "Successfully deployed version ${{ steps.vars.outputs.version }} to production!"

  publish_release:
    name: Promote Pre-release to Official Latest Release
    needs: [promote_and_deploy]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark Release as Production Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Promoting ${{ github.ref_name }} from Pre-release to Official Production Release..."
          gh release edit "${{ github.ref_name }}" --prerelease=false --latest
          echo "Release ${{ github.ref_name }} is now marked as the official latest release!"
