name: Deploy Scraper Service

on:
  push:
    tags:
      - 'scraper-service-v*'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Version tag to deploy or rollback to (e.g. 1.3.0 or scraper-service-v1.3.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-scraper-service
  cancel-in-progress: false

env:
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

jobs:
  meta:
    name: Resolve version & source image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
      source_sha: ${{ steps.m.outputs.source_sha }}
    steps:
      - name: Checkout tagged commit (full history to find the source commit)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: m
        env:
          TAG: ${{ github.ref_name }}
          SERVICE_DIRECTORY: services/scraper-service
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VER="${{ inputs.target_version }}"
            CLEAN_VER=$(echo "$RAW_VER" | sed -E 's/.*v//')
            echo "version=${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "tag=scraper-service-v${CLEAN_VER}" >> "$GITHUB_OUTPUT"
            echo "Manual deploy/rollback requested for version: ${CLEAN_VER}"
          else
            echo "version=${TAG#scraper-service-v}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          fi

          # The tag points at the release commit (version files only).
          # Follow the first-parent line of history on main to find the commit
          # that triggered CI and pushed the image to Docker Hub.
          SRC=$(git log -1 --first-parent --format=%H HEAD^ -- "$SERVICE_DIRECTORY" || true)
          echo "Source commit for image: $SRC"
          echo "source_sha=$SRC" >> "$GITHUB_OUTPUT"

  promote_and_deploy:
    name: Promote Image & Deploy
    needs: [meta]
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote Container Image (No Rebuild)
        run: |
          RELEASE_TAG="${{ needs.meta.outputs.version }}"
          SOURCE_SHA="${{ needs.meta.outputs.source_sha }}"

          # Verify if target release tag already exists (e.g. redeploy/rollback)
          if docker manifest inspect "${{ env.IMAGE }}:${RELEASE_TAG}" > /dev/null 2>&1; then
            echo "Image ${{ env.IMAGE }}:${RELEASE_TAG} already exists in registry."
          elif [ -n "$SOURCE_SHA" ]; then
            echo "Promoting image: ${{ env.IMAGE }}:${SOURCE_SHA} -> ${{ env.IMAGE }}:${RELEASE_TAG} and ${{ env.IMAGE }}:latest"
            docker buildx imagetools create \
              --tag "${{ env.IMAGE }}:${RELEASE_TAG}" \
              --tag "${{ env.IMAGE }}:latest" \
              "${{ env.IMAGE }}:${SOURCE_SHA}"
          else
            echo "::error::Neither ${{ env.IMAGE }}:${RELEASE_TAG} exists nor could source_sha be found!"
            exit 1
          fi

      - name: Deploy to AWS Batch / Fargate
        run: |
          echo "Deploying ${{ env.IMAGE }}:${{ needs.meta.outputs.version }} to AWS Batch..."
          # aws batch register-job-definition ...
          echo "Successfully deployed version ${{ needs.meta.outputs.version }} to production!"

  publish_release:
    name: Promote Pre-release to Official Latest Release
    needs: [meta, promote_and_deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark Release as Production Latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          echo "Promoting ${TAG} from Pre-release to Official Production Release..."
          gh release edit "${TAG}" --prerelease=false --latest
          echo "Release ${TAG} is now marked as the official latest release!"
