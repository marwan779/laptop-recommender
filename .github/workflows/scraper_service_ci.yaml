name: Scraper Service CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "services/scraper-service/**"
      - ".github/workflows/scraper_service_ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "services/scraper-service/**"
      - ".github/workflows/scraper_service_ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write


concurrency:
  group: scraper-service-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SERVICE_DIRECTORY: "services/scraper-service"
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

  
  

jobs:
  meta:
    name: Detect run type
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      is_release: ${{ steps.m.outputs.is_release }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - id: m
        env:
          EVENT: ${{ github.event_name }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$EVENT" == "push" && ("$MSG" == *"release-please--"* || "$MSG" =~ [Rr]elease[[:space:]]+scraper-service || "$MSG" =~ chore.*:\ +release) ]]; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$(jq -r '."services/scraper-service"' .release-please-manifest.json)" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  code_quality:
    name: Code Quality & Syntax Check
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.meta.outputs.is_release != 'true' && !startsWith(github.head_ref, 'release-please--')
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7   
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIRECTORY }}/requirements.txt

      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check -v --output-format sarif --output-file ruff-results.sarif"
          src: ${{ env.SERVICE_DIRECTORY }}

      - name: Upload Ruff SARIF report
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ruff-results.sarif
          category: ruff

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"
          src: ${{ env.SERVICE_DIRECTORY }}

      - name: Compile Python files (syntax check)
        run: python -m compileall -q app/

  security_governance:
    name: Security Governance
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.meta.outputs.is_release != 'true' && !startsWith(github.head_ref, 'release-please--')
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIRECTORY }}/requirements.txt

      - name: Dockerfile policy check (conftest)
        run: |
          docker run --rm -v "${{ github.workspace }}":/project -w /project openpolicyagent/conftest \
            test services/scraper-service/Dockerfile --policy dockerfile_security.rego

      - name: Bandit security scan
        run: |
          pip install "bandit[sarif]"
          bandit -r app/ -ll -f sarif -o bandit.sarif || true

      - name: Upload SARIF report
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4  
        with:
          sarif_file: ${{ env.SERVICE_DIRECTORY }}/bandit.sarif
          category: bandit

      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      
      - name: trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: vuln,secret,misconfig          
          format: 'sarif' 
          output: 'trivy.sarif' 
          limit-severities-for-sarif: true
          ignore-unfixed: true  
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: ${{ env.SERVICE_DIRECTORY}}

      - name: Upload Trivy SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy    
  testing:
    name: Testing & mutation 
    needs: [meta,code_quality,security_governance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.meta.outputs.is_release != 'true' && !startsWith(github.head_ref, 'release-please--')
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIRECTORY }}/requirements.txt

      - name: Install Dependencies & Test Frameworks
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov mutmut

      - name: unit test
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=50 tests/

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v6 
        with:
          name: coverage-report
          path: services/scraper-service/htmlcov/   
      
      - name: Mutation Testing with MutMut
        run: |
          mutmut run || true
          mutmut results > mutmut-results.txt 2>&1 || true

      - name: Upload MutMut Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutmut-results
          path: services/scraper-service/mutmut-results.txt


  packaging:
    name: Packaging, Scan & Delivery
    needs: [meta,testing]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.meta.outputs.is_release != 'true' && !startsWith(github.head_ref, 'release-please--')
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build container image
        run: |
          docker build \
            -t abdelhameed208/laptop_recommender_scraping_service:${{ github.sha }} \
            .
      
      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scanners: vuln,secret,misconfig
          image-ref: abdelhameed208/laptop_recommender_scraping_service:${{ github.sha }}
          format: 'sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          output: 'trivy_scraper_image.sarif'

      - name: Upload Trivy SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy_scraper_image.sarif
          category: trivy_image

      - name: Push container image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push abdelhameed208/laptop_recommender_scraping_service:${{ github.sha }}
  
  release_pr:
    name: Release PR (versioning)
    needs: packaging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true           
  
  promote:
    name: Promote image (retag)
    needs: meta
    if: needs.meta.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
 
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      # The Release PR commit only changes version files, so the image to promote
      # is the one built from the previous main commit (the last tested feature merge).
      - name: Verify source image exists
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.event.before }}
 
      - name: Retag (no rebuild)
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ needs.meta.outputs.version }} \
            ${{ env.IMAGE }}:${{ github.event.before }}
  
  deploy_prod:    
    name: Deploy to Production (Fargate)
    needs: [meta, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 30   
    if: needs.meta.outputs.is_release == 'true'
    steps: 
      - name: Deploy to Production (Fargate) placeholder 
        run: |
          echo "Deploy to Production (Fargate) placeholder"
          echo "Version: ${{ needs.meta.outputs.version }}"

  tag_release:
    name: Create tag & GitHub Release
    needs: deploy_prod
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true     
