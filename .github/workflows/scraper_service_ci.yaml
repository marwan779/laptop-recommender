name: Scraper Service CI

on:
  push:
    branches: [main]
    paths:
      - "services/scraper-service/**"
      - ".github/workflows/scraper_service_ci.yaml"
  pull_request:
    branches: [main]
    paths:
      - "services/scraper-service/**"
      - ".github/workflows/scraper_service_ci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: scraper-service-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SERVICE_DIRECTORY: "services/scraper-service"
  IMAGE: "abdelhameed208/laptop_recommender_scraping_service"

jobs:
  code_quality:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIRECTORY }}/requirements.txt

      - name: Ruff lint
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "check -v --output-format sarif --output-file ruff-results.sarif"
          src: ${{ env.SERVICE_DIRECTORY }}

      - name: Upload Ruff SARIF report
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ruff-results.sarif
          category: ruff

      - name: Ruff format check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          args: "format --check"
          src: ${{ env.SERVICE_DIRECTORY }}

      - name: Compile Python files (syntax check)
        run: python -m compileall -q app/

  security_governance:
    name: Security Governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIRECTORY }}/requirements.txt

      - name: Dockerfile policy check (conftest)
        run: |
          docker run --rm -v "${{ github.workspace }}":/project -w /project openpolicyagent/conftest \
            test services/scraper-service/Dockerfile --policy dockerfile_security.rego

      - name: Bandit security scan
        run: |
          pip install "bandit[sarif]"
          bandit -r app/ -ll -f sarif -o bandit.sarif || true

      - name: Upload SARIF report
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ env.SERVICE_DIRECTORY }}/bandit.sarif
          category: bandit

      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scanners: vuln,secret,misconfig
          format: 'sarif'
          output: 'trivy.sarif'
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          scan-ref: ${{ env.SERVICE_DIRECTORY }}

      - name: Upload Trivy SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: trivy

  testing:
    name: Testing & Mutation
    needs: [code_quality, security_governance]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.SERVICE_DIRECTORY }}/requirements.txt

      - name: Install Dependencies & Test Frameworks
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov mutmut

      - name: Unit test
        run: |
          PYTHONPATH=. pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=50 tests/

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: services/scraper-service/htmlcov/

      - name: Mutation Testing with MutMut
        run: |
          mutmut run || true
          mutmut results > mutmut-results.txt 2>&1 || true

      - name: Upload MutMut Results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutmut-results
          path: services/scraper-service/mutmut-results.txt

  packaging:
    name: Packaging, Scan & Delivery
    needs: [testing]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./services/scraper-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build container image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            .

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scanners: vuln,secret,misconfig
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: 'sarif'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'
          output: 'trivy_scraper_image.sarif'

      - name: Upload Trivy SARIF
        if: always() && github.event.pull_request.head.repo.fork != true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy_scraper_image.sarif
          category: trivy_image

      - name: Push container image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push ${{ env.IMAGE }}:${{ github.sha }}

  release_please:
    name: Release Please (PR & Tag Automation)
    needs: [packaging]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json
