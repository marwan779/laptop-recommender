[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-common"
version = "0.1.0"
description = "Shared common utilities and logging service for Laptop Recommender microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["common*"]

