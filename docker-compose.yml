services:
  nginx:
    image: nginx:1.27-alpine
    container_name: laptop-recommender-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - catalog-service
      - frontend
    networks:
      - laptop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laptop-recommender-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - catalog-service
    networks:
      - laptop-network

  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    container_name: laptop-recommender-catalog
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./services/catalog-service/.env
        required: false
    environment:
      - SERVICE_NAME=catalog-service
      - ENVIRONMENT=development
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - SCRAPER_SERVICE_URL=http://scraper-service:8000
      - AI_RECOMMENDER_URL=http://ai-recommender-service:8000
      - STORAGE_PROVIDER=s3
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraper-service:
        condition: service_started
      ai-recommender-service:
        condition: service_started
    networks:
      - laptop-network

  scraper-service:
    build:
      context: ./services/scraper-service
      dockerfile: Dockerfile
    container_name: laptop-recommender-scraper
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - path: ./services/scraper-service/.env
        required: false
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=s3
    volumes:
      - "./services/scraper-service/scraping results:/app/scraping results"
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laptop-network

  ai-recommender-service:
    build:
      context: ./services/ai-recommender-service
      dockerfile: Dockerfile
    container_name: laptop-recommender-ai
    restart: unless-stopped
    ports:
      - "8002:8000"
    env_file:
      - path: ./services/ai-recommender-service/.env
        required: false
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=s3
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - laptop-network

  users-service:
    build:
      context: ./services/users-service
      dockerfile: Dockerfile
    container_name: laptop-recommender-users
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${USERS_DATABASE_URL:?USERS_DATABASE_URL must be set in .env (see .env.example)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - laptop-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: laptop-recommender-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol port
      - "15672:15672"   # RabbitMQ Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - laptop-network

  redis:
    image: redis:7-alpine
    container_name: laptop-recommender-redis
    restart: unless-stopped
    ports:
      - "6379:6379"     # Redis standard port
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - laptop-network

volumes:
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local

networks:
  laptop-network:
    driver: bridge
